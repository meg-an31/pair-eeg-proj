<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Affect stream</title>
<style>
  :root{
    --bg:#0e1015; --panel:#161921; --line:#282d38;
    --ink:#e8eaef; --dim:#8d94a4; --accent:#8f9cf1;
    --ok:#4fbf98; --warn:#dd9a5c; --bad:#e2727c;
  }
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]){
      --bg:#eceef2; --panel:#fff; --line:#d4d8e1;
      --ink:#171a21; --dim:#6e7585; --accent:#3f4fb6;
      --ok:#1c7355; --warn:#a2571f; --bad:#a52e39;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;line-height:1.5}
  header{padding:16px 20px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-size:14px;margin:0;font-weight:600}
  main{padding:20px;display:grid;gap:16px;max-width:760px;margin:0 auto}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px 18px}
  .panel h2{font-size:10px;text-transform:uppercase;letter-spacing:.12em;
    color:var(--dim);margin:0 0 14px;font-weight:500}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;
    border-radius:99px;border:1px solid var(--line);font-size:11px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
  .axes{display:grid;gap:14px}
  .axis{display:grid;grid-template-columns:96px 1fr 48px;align-items:center;gap:12px}
  .axis .name{color:var(--dim);font-size:11px}
  .bar{height:10px;background:var(--bg);border:1px solid var(--line);
    border-radius:99px;overflow:hidden;position:relative}
  .bar i{display:block;height:100%;background:var(--accent);width:50%;
    transition:width .3s cubic-bezier(.4,0,.2,1)}
  .bar::after{content:"";position:absolute;left:50%;top:0;bottom:0;
    width:1px;background:var(--line)}
  .val{text-align:right;font-variant-numeric:tabular-nums;font-size:11px}
  .note{color:var(--dim);font-size:11px;margin:14px 0 0}
  .note.warn{color:var(--warn)}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.1em;
    color:var(--dim);font-weight:500;padding:5px 8px 5px 0}
  td{padding:4px 8px 4px 0;border-top:1px solid var(--line)}
  .idle{color:var(--dim);text-align:center;padding:28px 0}
  canvas{width:100%;height:170px;display:block}
</style>
</head>
<body>

<header>
  <h1>Affect stream</h1>
  <span class="pill"><span class="dot" id="dot"></span><span id="status">connecting…</span></span>
  <span class="pill" id="statePill">state: —</span>
  <span style="flex:1"></span>
  <span class="pill" id="viewers">—</span>
</header>

<main>
  <div class="panel">
    <h2>Axes — 0 to 1, 0.5 is the wearer's baseline</h2>
    <div class="axes" id="axes"></div>
    <p class="note" id="note"></p>
  </div>

  <div class="panel">
    <h2>Raw signal <span style="color:var(--dim);font-weight:400;text-transform:none;letter-spacing:0">
      — is anything actually arriving?</span></h2>
    <canvas id="rawScope"></canvas>
    <p class="note" id="rawHint">waiting…</p>
    <p class="note"><a href="./raw.html" style="color:var(--accent)">full inspector →</a></p>
  </div>

  <div class="panel">
    <h2>Signal</h2>
    <table>
      <tr><th>Session</th><td id="session">—</td></tr>
      <tr><th>Accept rate</th><td id="accept">—</td></tr>
      <tr><th>Calibrated</th><td id="calibrated">—</td></tr>
      <tr><th>Updated</th><td id="updated">—</td></tr>
    </table>
  </div>
</main>

<script type="module">
const $ = (id) => document.getElementById(id);
const AXES = ["valence","arousal","direction","engagement","autonomic"];

const params = new URLSearchParams(location.search);
const WS_URL = params.get("server")
  || (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";

// ?poll=1  -> poll GET /latest every second instead of holding a socket.
// Same numbers either way; the server computes on its own clock regardless.
const POLL_S = params.has("poll") ? Math.max(0.2, parseFloat(params.get("poll")) || 1) : 0;
const LATEST_URL = params.get("latest") || "/latest";

const els = {};
for (const name of AXES){
  const row = document.createElement("div");
  row.className = "axis";
  row.innerHTML = `<span class="name">${name}</span>
    <span class="bar"><i></i></span><span class="val">—</span>`;
  $("axes").appendChild(row);
  els[name] = { fill: row.querySelector("i"), val: row.querySelector(".val") };
}

function setDot(cls, text){
  $("dot").className = "dot" + (cls ? " " + cls : "");
  $("status").textContent = text;
}

let ws = null, attempt = 0, lastUpdate = 0;

function connect(){
  setDot("warn", "connecting…");
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    attempt = 0;
    setDot("ok", "connected");
    ws.send(JSON.stringify({ type: "hello", role: "viewer" }));
  };

  ws.onclose = () => {
    setDot("bad", "disconnected");
    const delay = Math.min(500 * 2 ** attempt++, 10000);
    setTimeout(connect, delay);
  };

  ws.onmessage = (ev) => {
    if (typeof ev.data !== "string") return;
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }

    if (msg.type === "status"){
      $("session").textContent = msg.session ?? "none";
      $("viewers").textContent = `${msg.viewers} watching`;
      if (!msg.capture_held){
        $("statePill").textContent = "state: idle";
        $("note").textContent = "No headband streaming right now.";
        $("note").className = "note";
        for (const a of AXES){ els[a].fill.style.width = "50%"; els[a].val.textContent = "—"; }
      }
      return;
    }

    if (msg.type === "session_started"){
      $("session").textContent = msg.session;
      $("note").textContent = "";
      return;
    }

    if (msg.type === "session_ended"){
      $("statePill").textContent = "state: idle";
      $("note").textContent = "Streaming stopped.";
      return;
    }

    if (msg.type === "snapshot"){
      $("session").textContent = msg.session ?? "—";
      $("statePill").textContent = "state: " + (msg.state ?? "—");
      if (msg.stages && msg.stages.affect?.startsWith("null")){
        $("note").className = "note warn";
        $("note").textContent =
          "Affect stage not implemented — axes are pinned to 0.5.";
      }
      return;
    }

    if (msg.type !== "estimate") return;

    $("statePill").textContent = "state: " + msg.state
      + (msg.baseline ? ` ${(msg.baseline.progress*100).toFixed(0)}%` : "");
    if (msg.quality) $("accept").textContent = (msg.quality.accept_rate*100).toFixed(0) + "%";
    if (msg.affect){
      $("calibrated").textContent = msg.affect.calibrated ? "yes" : "no";
      if (!msg.affect.implemented){
        $("note").className = "note warn";
        $("note").textContent = "Affect stage not implemented — axes pinned to 0.5.";
      } else {
        $("note").textContent = "";
      }
    }
    if (msg.axes){
      for (const [name, value] of Object.entries(msg.axes)){
        const el = els[name]; if (!el) continue;
        el.fill.style.width = (value*100).toFixed(1) + "%";
        el.val.textContent = value.toFixed(2);
      }
      lastUpdate = Date.now();
    }
  };
}

// ---- raw scope ---------------------------------------------------------
// Polls the inspection API, which reads the ring buffer directly. Nothing on
// this path touches the analysis stages, so a flat trace here means the
// problem is upstream of the pipeline rather than in it.
const rawCanvas = $("rawScope"), rawCtx = rawCanvas.getContext("2d");
let rawData = null;

function sizeRaw(){
  const dpr = devicePixelRatio || 1;
  rawCanvas.width = rawCanvas.clientWidth * dpr;
  rawCanvas.height = rawCanvas.clientHeight * dpr;
  rawCtx.setTransform(dpr,0,0,dpr,0,0);
  drawRaw();
}
addEventListener("resize", sizeRaw);

function drawRaw(){
  const w = rawCanvas.clientWidth, h = rawCanvas.clientHeight;
  rawCtx.clearRect(0,0,w,h);
  const css = getComputedStyle(document.documentElement);
  if (!rawData || !rawData.samples?.length){
    rawCtx.fillStyle = css.getPropertyValue("--dim").trim();
    rawCtx.font = "12px ui-monospace, monospace";
    rawCtx.fillText("no samples", 10, 20);
    return;
  }
  const rows = rawData.samples, nCh = rawData.channels.length, laneH = h/nCh;
  const accent = css.getPropertyValue("--accent").trim();
  const dim = css.getPropertyValue("--dim").trim();

  for (let c=0;c<nCh;c++){
    let peak = 1e-9;
    for (const r of rows){ const v=r[c]; if (v!=null) peak = Math.max(peak, Math.abs(v)); }
    peak = Math.min(Math.max(peak,10),500);
    const mid = laneH*c + laneH/2;
    rawCtx.strokeStyle = accent; rawCtx.lineWidth = 1;
    rawCtx.beginPath();
    let pen = false;
    for (let i=0;i<rows.length;i++){
      const v = rows[i][c];
      const x = (i/(rows.length-1||1))*w;
      if (v == null){ pen = false; continue; }   // hole: break the line
      const y = mid - (v/peak)*(laneH*0.38);
      if (!pen){ rawCtx.moveTo(x,y); pen = true; } else rawCtx.lineTo(x,y);
    }
    rawCtx.stroke();
    rawCtx.fillStyle = dim; rawCtx.font = "9.5px ui-monospace, monospace";
    rawCtx.fillText(`${rawData.channels[c]} ±${peak.toFixed(0)}µV`, 5, laneH*c+11);
  }
}

async function pollRaw(){
  try {
    const res = await fetch("/raw/eeg?n=768", {cache:"no-store"});
    const data = await res.json();
    if (data.type === "idle"){
      rawData = null;
      $("rawHint").textContent = "nothing streaming";
    } else {
      rawData = data;
      $("rawHint").textContent =
        `${data.n} samples @ ${data.fs} Hz · fill ${(data.fill*100).toFixed(1)}%`
        + (data.missing ? ` · ${data.missing} missing` : "");
    }
    drawRaw();
  } catch {
    $("rawHint").textContent = "inspection API unavailable";
  }
  setTimeout(pollRaw, 500);
}
sizeRaw();
pollRaw();

setInterval(() => {
  $("updated").textContent = lastUpdate
    ? Math.round((Date.now()-lastUpdate)/1000) + "s ago" : "—";
}, 1000);

function applyAxes(msg){
  if (!msg.axes) return;
  for (const [name, value] of Object.entries(msg.axes)){
    const el = els[name]; if (!el) continue;
    el.fill.style.width = (value*100).toFixed(1) + "%";
    el.val.textContent = value.toFixed(2);
  }
  lastUpdate = Date.now();
}

async function poll(){
  try {
    const res = await fetch(LATEST_URL, { cache: "no-store" });
    const msg = await res.json();
    setDot("ok", `polling every ${POLL_S}s`);

    if (msg.type === "idle"){
      $("statePill").textContent = "state: idle";
      $("note").textContent = "No headband streaming right now.";
      $("session").textContent = "none";
    } else if (msg.type === "warming_up"){
      $("statePill").textContent = "state: " + msg.state;
      $("session").textContent = msg.session;
      $("note").textContent = "Waiting for the first full window…";
    } else {
      $("session").textContent = msg.session ?? "—";
      $("statePill").textContent = "state: " + msg.state;
      if (msg.accept_rate != null) $("accept").textContent = (msg.accept_rate*100).toFixed(0) + "%";
      $("calibrated").textContent = msg.calibrated ? "yes" : "no";
      $("note").className = msg.implemented ? "note" : "note warn";
      $("note").textContent = msg.implemented
        ? "" : "Affect stage not implemented — axes pinned to 0.5.";
      applyAxes(msg);
    }
  } catch {
    setDot("bad", "poll failed");
  }
  setTimeout(poll, POLL_S * 1000);
}

if (POLL_S) { $("viewers").textContent = "polling"; poll(); }
else connect();
</script>
</body>
</html>
