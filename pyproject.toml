[project]
name = "pair-eeg"
version = "0.1.0"
description = "Streaming infrastructure for Muse EEG affect estimation"
requires-python = ">=3.11"
dependencies = ["websockets>=12.0", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
